<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jigsaw Puzzle</title>
  <link rel="stylesheet" href="pazuru.css">
</head>
<body>

  <h1 id="puzzleTitle">ジグソーパズル</h1>

  <div id="puzzle-container">
    <canvas id="puzzleCanvas" width="1000" height="600"></canvas>
  </div>
  <div id="message"></div>

  <!-- 操作ボタンの追加 -->
  <div id="controls">
    <button id="restartBtn">リスタート</button>
    <button id="backBtn">マス目選択に戻る</button>
  </div>

  <script src="pazuru.js"></script>
</body>
</html>
